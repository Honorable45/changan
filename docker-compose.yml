# Services de base pour la production : PostgreSQL et stockage S3 (MinIO). API et site se lancent à part (voir README).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: changan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
      POSTGRES_DB: changan
    volumes: [dbdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?définir S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?définir S3_SECRET_KEY}
    volumes: [miniodata:/data]
volumes:
  dbdata:
  miniodata:
