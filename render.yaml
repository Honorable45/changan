# Mise en ligne gratuite du jeu « Lomé en jeu » sur Render (https://render.com), depuis ce dépôt GitHub :
# Render > New > Blueprint > choisir ce dépôt. Voir jeu/DEPLOIEMENT.md.
services:
  # Serveur du jeu en ligne : multijoueur (WebSocket /ws) et savoir partagé de SMART AI (/savoir).
  - type: web
    name: lome-jeu-serveur
    runtime: docker
    plan: free
    dockerfilePath: ./jeu/serveur/Dockerfile
    dockerContext: .
    healthCheckPath: /sante
    envVars:
      # Adresse réelle du joueur : Render passe par Cloudflare, qui pose toujours CF-Connecting-IP (un client ne peut pas l'imposer).
      - key: IP_ENTETE
        value: cf-connecting-ip
      # Repli si l'en-tête manquait : X-Forwarded-For vaut « joueur, Cloudflare, Render » (vérifié), le joueur est 3e en partant de la droite.
      - key: TRUST_PROXY
        value: "3"
      # Beaucoup de joueurs mobiles au Togo partagent une adresse (CGNAT) : 30 connexions par adresse, 30 nouvelles par minute.
      - key: CONNEXIONS_PAR_IP
        value: "30"
      - key: MAX_JOUEURS
        value: "1500"
      - key: CAPACITE_SALLE
        value: "60"
      # Seul le site du jeu peut se connecter au serveur.
      - key: ORIGINES
        fromService:
          type: web
          name: lome-jeu
          property: host

  # Le jeu : fichiers statiques compilés par Vite.
  - type: web
    name: lome-jeu
    runtime: static
    buildCommand: npx -y pnpm@9.15.9 install --frozen-lockfile --filter jeu-client && npx -y pnpm@9.15.9 --filter jeu-client build
    staticPublishPath: ./jeu/client/dist
    envVars:
      # Le jeu se connecte au serveur ci-dessus : wss://<son adresse>/ws.
      - key: VITE_SERVEUR_HOST
        fromService:
          type: web
          name: lome-jeu-serveur
          property: host
      # Adresse du site de la concession (liens « Réserver un vrai essai ») : à remplir dans Render si le site est en ligne.
      - key: VITE_SITE_URL
        sync: false
    headers:
      # En-têtes de sécurité : copie exacte de jeu/client/securite.mjs (vérifiée par le test « en-têtes de sécurité »).
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; connect-src 'self' https://lome-jeu-serveur.onrender.com wss://lome-jeu-serveur.onrender.com blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "microphone=(self), camera=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /config.json
        name: Cache-Control
        value: no-cache
